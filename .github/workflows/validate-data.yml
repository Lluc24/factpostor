name: Validate game data

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build data bundle (schema + duplicate checks) and app bundles
        run: npm run build

      - name: Check generated bundles are up to date
        run: |
          if ! git diff --quiet -- js/data.bundle.js js/i18n.js js/images.js app.js; then
            echo "Generated files are out of date. Run 'npm run build' and commit the result." >&2
            git diff -- js/data.bundle.js js/i18n.js js/images.js app.js
            exit 1
          fi

      - name: Validate Wikipedia image sources
        run: npm run validate-images
